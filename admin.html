<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineQR Hotel Admin</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#fff;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #0001}input,select{padding:11px;border:1px solid #ccd2dc;border-radius:8px;margin:4px}.btn{background:#172033;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}img{max-width:260px}.muted{color:#667085}.ok{padding:10px;background:#eefbf2;border-radius:8px}.err{padding:10px;background:#fff0f0;border-radius:8px}</style></head><body><div class="wrap"><h1>DineQR Hotel Admin</h1><div id="auth" class="card"><h2>Register your hotel</h2><p class="muted">Each hotel gets its own isolated menu, orders and QR code.</p><input id="hn" placeholder="Hotel name"><input id="un" placeholder="Your name"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ chars)"><input id="ph" placeholder="Phone"><br><button class="btn" onclick="registerHotel()">Register hotel</button><button class="btn" onclick="login()">Login</button><div id="authMsg"></div></div><div id="dash" style="display:none"><div class="grid"><div class="card"><h2>Hotel</h2><div id="hotel"></div><img id="qr"><p>Print this QR and place it at the hotel entrance.</p></div><div class="card"><h2>Add dish</h2><input id="dn" placeholder="Dish name"><input id="dp" type="number" step="0.01" placeholder="Price in KSh"><input id="dd" placeholder="Description"><select id="dc"></select><button class="btn" onclick="addDish()">Add dish</button></div></div><div class="card"><h2>Menu</h2><div id="menu"></div></div><div class="card"><h2>Orders</h2><div id="orders"></div></div><button class="btn" onclick="logout()">Log out</button></div></div><script>
let token=localStorage.dineqrAccessToken;async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function msg(t,ok=false){authMsg.innerHTML='<div class="'+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
async function registerHotel(){try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hotelName:hn.value,name:un.value,email:em.value,password:pw.value,phone:ph.value})});const j=await r.json();if(!r.ok)return msg(j.error||'Registration failed');if(j.access_token){token=j.access_token;localStorage.dineqrAccessToken=token;await boot()}else msg(j.message||'Registration successful. Check your email, then log in.',true)}catch(e){msg(e.message)}}
async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});const j=await r.json();if(!r.ok)return msg(j.error||'Login failed');token=j.access_token;localStorage.dineqrAccessToken=token;await boot()}catch(e){msg(e.message)}}
async function boot(){auth.style.display='none';dash.style.display='block';try{const me=await api('/api/admin/me');hotel.innerHTML='<b>'+esc(me.hotel.name)+'</b><br>Slug: '+esc(me.hotel.slug)+'<br>Customer URL: <a href="'+esc(me.qrUrl)+'" target="_blank">'+esc(me.qrUrl)+'</a><br>Role: '+esc(me.user.role);qr.src=me.qrPngUrl;await refresh()}catch(e){logout();msg(e.message)}}
async function refresh(){const m=await api('/api/admin/menu');dc.innerHTML=m.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');menu.innerHTML=m.dishes.map(d=>`<div class="card"><b>${esc(d.name)}</b> — KSh ${Number(d.price).toLocaleString()} — ${d.is_available?'Available':'Unavailable'} <button class="btn" onclick="toggle('${d.id}',${d.is_available?0:1})">Toggle</button><br><span class="muted">${esc(d.description||'')}</span></div>`).join('')||'No dishes yet';const os=await api('/api/admin/orders');orders.innerHTML=os.map(o=>`<div class="card"><b>#${o.id.slice(0,8)}</b> · ${esc(o.destination)} ${esc(o.destination_number||'')} · KSh ${Number(o.total).toLocaleString()} · ${o.payment?.status||'unpaid'}<select onchange="status('${o.id}',this.value)">${['pending','confirmed','preparing','ready','delivered','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><br>${o.items.map(i=>i.quantity+'× '+esc(i.item_name)+' @ KSh '+Number(i.unit_price).toLocaleString()).join(', ')}</div>`).join('')||'No orders yet'}
async function addDish(){try{await api('/api/admin/dishes',{method:'POST',body:JSON.stringify({name:dn.value,price:Number(dp.value),description:dd.value,categoryId:dc.value})});dn.value=dp.value=dd.value='';refresh()}catch(e){alert(e.message)}}async function toggle(id,v){await api('/api/admin/dishes/'+id,{method:'PATCH',body:JSON.stringify({available:!!v})});refresh()}async function status(id,v){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:v})});refresh()}function logout(){localStorage.removeItem('dineqrAccessToken');token='';dash.style.display='none';auth.style.display='block'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}if(token)boot();
</script></body></html>
