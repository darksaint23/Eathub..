
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EatHub - Reset Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f2f7f3;color:#203027}
main{max-width:430px;margin:40px auto;padding:24px;background:#fff;border-radius:12px;box-shadow:0 4px 18px #00000010}
.brand{font-size:28px;font-weight:bold;color:#167344}
p{line-height:1.6;color:#58665d}
label{display:block;margin-top:20px;font-weight:bold}
input{width:100%;padding:13px;margin-top:7px;border:1px solid #ccd6ce;border-radius:7px;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;background:#167344;color:#fff;border:0;border-radius:7px;font-size:16px;font-weight:bold}
.notice{padding:12px;background:#edf7ef;border-radius:7px;font-size:14px}
a{color:#167344}
</style>
</head>
<body>
<main>
<div class="brand">EatHub</div>
<h1>Forgot your password?</h1>
<p>Enter the email address associated with your EatHub account.</p>

<div class="notice">
Password recovery is not connected yet. This page will not send an email until Supabase authentication is integrated.
</div>

<form id="resetForm">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<button type="submit">Password recovery coming soon</button>
<p id="message" role="status"></p>
</form>

<p><a href="/login.html">Return to sign in</a></p>
<p><a href="/">Back to EatHub home</a></p>
</main>

<script>
document.getElementById("resetForm").addEventListener("submit",function(event){
event.preventDefault();
document.getElementById("message").textContent=
"Password recovery is not active yet. No email has been sent.";
});
</script>
</body>
</html>
