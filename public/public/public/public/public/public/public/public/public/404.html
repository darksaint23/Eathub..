
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found - EatHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f7f3;
      color: #203027;
    }
    main {
      width: 100%;
      max-width: 450px;
      padding: 30px 24px;
      background: white;
      border-radius: 14px;
    }
    .brand {
      font-size: 28px;
      font-weight: bold;
      color: #167344;
    }
    .number {
      margin: 20px 0 0;
      font-size: 64px;
      font-weight: bold;
      color: #167344;
    }
    p { line-height: 1.6; color: #58665d; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 13px 20px;
      border-radius: 8px;
      background: #167344;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">EatHub</div>
    <div class="number">404</div>
    <h1>Page not found</h1>
    <p>
      Sorry, we couldn't find the page you're looking for.
      Check the address or return to the EatHub homepage.
    </p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
