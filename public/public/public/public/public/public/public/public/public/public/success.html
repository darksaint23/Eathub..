
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmation - EatHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f7f3;
      color: #203027;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      text-align: center;
      background: white;
      border-radius: 14px;
    }
    .brand {
      color: #167344;
      font-size: 28px;
      font-weight: bold;
    }
    .mark {
      margin-top: 24px;
      font-size: 54px;
      color: #167344;
    }
    p { line-height: 1.7; color: #58665d; }
    a {
      display: inline-block;
      margin-top: 14px;
      padding: 13px 20px;
      border-radius: 8px;
      background: #167344;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">EatHub</div>
    <div class="mark" aria-hidden="true">&#10003;</div>
    <h1>Action confirmation</h1>
    <p id="message">
      Please check the relevant EatHub page to confirm the status
      of your request.
    </p>
    <p>
      This page alone does not confirm a registration, order,
      or payment.
    </p>
    <a href="/">Return to homepage</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");

    const messages = {
      registration: "Your registration status must be confirmed by EatHub.",
      order: "Your order status must be confirmed by the restaurant.",
      payment: "Your payment must be verified by the payment system."
    };

    if (type && messages[type]) {
      document.getElementById("message").textContent = messages[type];
    }
  </script>
</body>
</html>
